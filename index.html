<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="2026-11-15.5">
<title>喵學堂：養寵物學語言</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7f0;--bg2:#f3ede2;--card:#fff;--ink:#1c2230;--muted:#6b6f7b;--line:#ece4d6;--good:#16a34a;--good-soft:#e7f8ec;--bad:#dc2626;--bad-soft:#fdecec;--radius:22px;--shadow:0 2px 0 rgba(28,34,48,.04),0 8px 24px rgba(28,34,48,.07);
  --accent:#ea7a1a;--accent-dark:#c2600c;--accent-soft:#fdeedd;--grad:linear-gradient(135deg,#f9a03f,#ea7a1a)}
body[data-theme="gept"]{--accent:#0d9488;--accent-dark:#0f766e;--accent-soft:#dff5f1;--grad:linear-gradient(135deg,#14b8a6,#0d9488)}
body[data-theme="toeic"]{--accent:#4f46e5;--accent-dark:#4338ca;--accent-soft:#e9e8fd;--grad:linear-gradient(135deg,#6366f1,#4f46e5)}
body[data-theme="toefl"]{--accent:#e0572b;--accent-dark:#c2410c;--accent-soft:#fdebe3;--grad:linear-gradient(135deg,#fb7c4a,#e0572b)}
body[data-theme="ja"]{--accent:#db2777;--accent-dark:#be185d;--accent-soft:#fde7f1;--grad:linear-gradient(135deg,#f472b6,#db2777)}
body[data-theme="ko"]{--accent:#2563eb;--accent-dark:#1d4ed8;--accent-soft:#e3ecfe;--grad:linear-gradient(135deg,#60a5fa,#2563eb)}
*{box-sizing:border-box}
html{font-size:17px}
html,body{margin:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;line-height:1.65}
body[data-lang="en"] .fx:not(.word){font-family:Georgia,"Noto Sans TC",serif}
body[data-lang="ja"] .fx{font-family:"Noto Sans JP","Noto Sans TC",sans-serif}
body[data-lang="ko"] .fx{font-family:"Noto Sans KR","Noto Sans TC",sans-serif}
button,input{font:inherit;color:inherit}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:116px}
header{position:sticky;top:0;z-index:10;background:rgba(251,247,240,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 16px 10px}
.top{display:flex;align-items:center;gap:10px}
.timer{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:.95rem;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.running{background:var(--grad);color:#fff;border-color:transparent}
/* mini cat strip */
.mini{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:var(--card);border-radius:18px;padding:4px 12px 4px 4px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.mini .mc{width:48px;height:48px;border-radius:14px;background:#fdebd0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none}
.mini .mt{flex:1;min-width:0}
.mini .mn{font-weight:700;font-size:1rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mn small{font-weight:500;color:var(--muted);margin-left:6px;font-size:.8rem}
.mini .mb{display:block;height:9px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:4px}
.mini .mb i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#f97316);border-radius:99px;transition:width .4s}
.mini.warn .mb i{background:linear-gradient(90deg,#f87171,#dc2626)}
.mini .mf{font-weight:700;font-size:.98rem;white-space:nowrap}
.trackrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.langchip{border:0;background:var(--accent-soft);color:var(--accent-dark);font-weight:700;border-radius:12px;padding:9px 12px;cursor:pointer;white-space:nowrap;font-size:.95rem}
.seg{display:flex;flex:1;background:var(--bg2);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:transparent;font-size:.95rem;padding:7px 4px;border-radius:10px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--accent-dark);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tracklabel{color:var(--muted);font-size:.95rem}
main{padding:6px 16px 18px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
nav.tabs .inner{display:flex;max-width:616px;margin:0 auto;background:var(--card);border-radius:24px;box-shadow:0 8px 30px rgba(28,34,48,.15);padding:6px}
nav.tabs button{flex:1;border:0;background:none;font-size:.82rem;color:var(--muted);padding:7px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:18px}
nav.tabs .ic{font-size:1.45rem;line-height:1.15;font-weight:700}
nav.tabs button.on{color:var(--accent-dark);font-weight:700;background:var(--accent-soft)}
.card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.center{justify-content:center}
.muted{color:var(--muted);font-size:.95rem}
.small{font-size:.9rem}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent-dark);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700}
.btn{border:0;border-radius:16px;padding:15px 18px;font-size:1.06rem;font-weight:700;cursor:pointer;background:var(--grad);color:#fff;width:100%;box-shadow:0 4px 0 var(--accent-dark);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dark)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.soft{background:var(--bad-soft);color:var(--bad);box-shadow:0 4px 0 #f6c9c9}
.btn.ok{background:var(--good-soft);color:var(--good);box-shadow:0 4px 0 #bfe9cc}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btns{display:flex;gap:12px;margin-top:16px}
.sub{display:flex;gap:10px;margin:8px 0 14px}
.sub button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:11px;font-size:1rem;cursor:pointer;color:var(--muted)}
.sub button.on{border-color:var(--accent);color:var(--accent-dark);font-weight:700;background:var(--accent-soft)}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .35s}
.bar.food i{background:linear-gradient(90deg,#fbbf24,#f97316)}
.bar.food.warn i{background:linear-gradient(90deg,#f87171,#dc2626)}
.intro{font-size:.98rem;color:var(--muted);margin:8px 0 6px;background:var(--accent-soft);border-radius:14px;padding:10px 14px;color:var(--accent-dark)}
.feedtip{font-size:.92rem;color:var(--muted);text-align:center;margin:-4px 0 12px}
/* flashcard */
.flip{perspective:1200px;cursor:pointer;user-select:none}
.flip .in{position:relative;height:330px;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.face.front{background:var(--grad);color:#fff}
.face.front .pos{color:rgba(255,255,255,.88)}
.face.front .speak{background:rgba(255,255,255,.22);border-color:transparent;color:#fff}
.face.back{transform:rotateY(180deg)}
.word{font-family:Fraunces,Georgia,serif;font-size:2.8rem;line-height:1.2;word-break:break-word}
.word.huge{font-size:5.6rem;line-height:1.1}
.pos{font-style:italic;margin-top:6px;font-size:1.15rem}
.tap{margin-top:16px;font-size:.88rem;opacity:.85}
.zh{font-size:1.75rem;font-weight:700;margin-bottom:12px;color:var(--accent-dark)}
.ex{font-size:1.15rem}
.exzh{color:var(--muted);font-size:1rem;margin-top:6px}
.speak{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 18px;margin-top:14px;cursor:pointer;font-size:1rem}
.hint{text-align:center;color:var(--muted);font-size:.95rem;margin-top:10px}
/* quiz */
.q{font-size:1.28rem;font-weight:500;margin:6px 0 16px;line-height:1.55}
.q.big{font-size:2.2rem;font-weight:700}
.q u{text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 18px;margin-bottom:10px;cursor:pointer;font-size:1.14rem;line-height:1.45}
.opt:not(:disabled):active{transform:scale(.98)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700;animation:pop .35s}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shake .35s}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.exp{background:var(--bg);border-radius:16px;padding:14px 16px;font-size:1.02rem;margin-top:8px;border-left:5px solid var(--accent)}
.exp b{display:block;margin-bottom:4px;font-size:1.06rem}
/* reading */
.passage{font-size:1.2rem;line-height:1.85;white-space:pre-line}
.line{padding:8px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line .fx{font-size:1.25rem}
.line .rm{color:var(--accent-dark);font-size:.98rem}
.line .lz{color:var(--muted);font-size:.98rem}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.95rem}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);font-weight:700}
.rlist{display:block;width:100%;text-align:left;cursor:pointer;border:0}
.rlist:active{transform:scale(.98)}
.back{border:0;background:none;color:var(--accent-dark);font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:8px;font-size:1.05rem}
.big{font-family:Fraunces,Georgia,serif;font-size:3.4rem;line-height:1.1;color:var(--accent-dark)}
h2{font-size:1.25rem;margin:0 0 6px}
h2.sec{margin:22px 4px 12px}
/* cat home */
.room{position:relative;border-radius:22px;background:linear-gradient(#fdebd0 0 70%,#e6c59a 70%);height:270px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.room.dead{background:linear-gradient(#e2e8f0 0 70%,#cbd5e1 70%)}
.window{position:absolute;top:22px;left:22px;width:78px;height:66px;border-radius:10px;background:linear-gradient(#a5d8ff,#e7f5ff);border:5px solid #fff}
.window:before,.window:after{content:"";position:absolute;background:#fff}
.window:before{left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%)}
.window:after{top:50%;left:0;right:0;height:4px;transform:translateY(-50%)}
.plant{position:absolute;left:20px;bottom:14px;font-size:2.4rem}
.bowl{position:absolute;right:22px;bottom:16px;background:#fff;border-radius:14px;padding:4px 10px;font-weight:700;font-size:.95rem;box-shadow:var(--shadow)}
.catwrap{cursor:pointer;margin-bottom:-4px}
.hop{animation:hop .55s}
@keyframes hop{30%{transform:translateY(-16px)}60%{transform:translateY(0)}80%{transform:translateY(-4px)}}
.bubble{position:absolute;top:18px;right:16px;max-width:56%;background:#fff;border-radius:16px;padding:9px 13px;font-size:.98rem;box-shadow:var(--shadow);line-height:1.45}
.bubble:after{content:"";position:absolute;bottom:-8px;left:26px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.catname{font-size:1.5rem;font-weight:700;text-align:center;margin-top:12px}
.mini-btn{border:0;background:none;cursor:pointer;font-size:1.1rem;padding:2px 4px}
.status{margin-top:4px;font-size:1rem}
.status.warn{color:var(--bad);font-weight:700;background:var(--bad-soft);border-radius:12px;padding:10px 12px}
.stat{flex:1;background:var(--accent-soft);border-radius:16px;padding:12px 6px;text-align:center}
.stat .n{font-size:1.4rem;font-weight:700;color:var(--accent-dark)}
.tile{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.tile:active{transform:scale(.98)}
.badge{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.4rem;flex:none}
.tile .tt{flex:1}
.tile b{display:block;font-size:1.2rem}
.tile small{color:var(--muted);font-size:.9rem}
.tile .tp{color:var(--muted);font-size:.88rem;text-align:right}
.inp{width:100%;font-size:1.1rem;padding:12px 14px;border:2px solid var(--line);border-radius:14px;margin:10px 0 4px;background:var(--card)}
.inp:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fly{position:fixed;font-weight:700;color:#ea580c;pointer-events:none;z-index:40;animation:fly 1.1s forwards;font-size:1.15rem}
@keyframes fly{from{opacity:1;transform:translateY(0) scale(1.1)}to{opacity:0;transform:translateY(-44px)}}
.toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-size:1rem;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
ul.tips{margin:8px 0 0;padding-left:22px}
.lvcard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 16px;margin:4px 0 14px;box-shadow:var(--shadow)}
.lvbadge{background:var(--grad);color:#fff;font-weight:700;border-radius:12px;padding:6px 12px;font-size:1.05rem;white-space:nowrap}
.lvt{flex:1;min-width:0}
.lvbar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-bottom:4px}
.lvbar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.lvmini{font-size:.75rem;background:var(--bg2);color:var(--muted);border-radius:999px;padding:1px 8px;vertical-align:middle;margin-left:4px}
.rlist.locked{opacity:.55}
.modal{position:fixed;inset:0;background:rgba(20,20,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);border-radius:24px 24px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-width:640px;width:100%;max-height:88vh;overflow:auto}
.modal .exp{margin-bottom:10px}
.sppick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spbtn{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:6px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.spbtn b{font-size:.95rem}
.spbtn small{font-size:.75rem;color:var(--muted)}
.spbtn.on{border-color:var(--accent);background:var(--accent-soft)}
body[data-mode="lesson"] header, body[data-mode="lesson"] nav.tabs{display:none}
body[data-mode="lesson"] .app{padding-bottom:200px}
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border-radius:16px;padding:10px 14px;margin:4px 0 14px;box-shadow:var(--shadow);font-size:1rem}
.hud .chip{margin-left:auto}
.secb{display:flex;justify-content:space-between;align-items:center;background:var(--grad);color:#fff;border-radius:20px;padding:14px 18px;margin:18px 0 8px;box-shadow:0 4px 0 var(--accent-dark)}
.secb b{font-size:1.2rem}.secic{font-size:2rem}
.unith{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 4px 4px}
.unith b{font-size:1.05rem}
.nodes{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0 6px}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:72px;height:72px;border-radius:50%;border:0;font-size:1.7rem;font-weight:700;cursor:pointer;background:var(--grad);color:#fff;box-shadow:0 7px 0 var(--accent-dark);transition:transform .1s}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 var(--accent-dark)}
.node.done{background:linear-gradient(135deg,#fcd34d,#f59e0b);box-shadow:0 7px 0 #b45309}
.node.lock{background:#e5e1da;color:#a8a29e;box-shadow:0 7px 0 #cfc8bd}
.node.cur{animation:pulse 1.6s infinite}
.node.t-review{border-radius:22px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.tip{position:absolute;top:-38px;background:var(--card);color:var(--accent-dark);font-weight:700;border-radius:12px;padding:4px 12px;white-space:nowrap;box-shadow:var(--shadow);font-size:.95rem;animation:hop 1.6s infinite}
.lstop{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.xbtn{border:0;background:none;font-size:1.3rem;color:var(--muted);cursor:pointer;padding:4px 6px;white-space:nowrap}
.lsbar{flex:1;margin:0;height:14px}
.lh{font-weight:700;white-space:nowrap}
.lscard{min-height:300px}
.newtag{background:#ede9fe;color:#6d28d9}
.bigspk{width:110px;height:110px;border-radius:28px;border:0;background:var(--grad);font-size:3rem;cursor:pointer;box-shadow:0 6px 0 var(--accent-dark)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;display:block;margin:8px auto 0;font-size:.95rem}
.ansline{min-height:64px;border-bottom:2px solid var(--line);padding:8px 0;margin:8px 0 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.wtile{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:1.1rem;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.wtile.used{background:var(--bg2);color:transparent;box-shadow:none}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mgrid>div{display:flex;flex-direction:column;gap:10px}
.wtile.mt{width:100%;min-height:54px}
.wtile.sel{border-color:var(--accent);background:var(--accent-soft)}
.wtile.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:.6}
.wtile.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.fbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px 18px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;font-size:1.05rem}
.fbar>div{max-width:604px;margin:0 auto;width:100%}
.fbar .btn{max-width:604px;margin:0 auto}
.fbar.ok{background:#dcfce7;color:#15803d}
.fbar.bad{background:#fee2e2;color:#b91c1c}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kcell{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.kcell b{font-size:1.4rem}.kcell small{font-size:.72rem;color:var(--muted)}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .wt{flex:1;min-width:0}
.wrow b{font-size:1.1rem}
.lv{font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent-dark);white-space:nowrap}
.lv.m{background:var(--good-soft);color:var(--good)}
.lv.n{background:#fef3c7;color:#b45309}
</style>
</head>
<body>
<div class="app">
  <header id="hdr"></header>
  <main id="main"></main>
</div>
<nav class="tabs"><div class="inner" id="tabs"></div></nav>
<div class="toast" id="toast"></div>
<script>
const EXAMS = {
gept:{name:"全民英檢中級",short:"英檢中級",
vocab:[
["abandon","v.","放棄；拋棄","He had to abandon his car in the snow.","他不得不把車丟在雪地裡。"],

{title:"How Migrating Birds Find Their Way",type:"學術文章",text:"Every autumn, billions of birds migrate thousands of kilometers to warmer regions. For centuries, how they navigate with such precision remained a mystery. Researchers now believe that birds rely on several cues at once.\n\nDuring the day, many species use the position of the sun, adjusting for its movement across the sky. At night, songbirds appear to orient themselves using star patterns around the North Star.\n\nPerhaps most remarkably, experiments suggest that some birds can sense Earth's magnetic field. When scientists attached small magnets to homing pigeons on cloudy days, the birds frequently lost their way. On sunny days, however, the magnets had little effect, indicating that the birds simply switched to using the sun. This flexibility allows migrating birds to continue their journeys even when one source of information becomes unavailable.",
qs:[
{q:"What is the main idea of the passage?",o:["Birds migrate only during the day","Birds use several different cues to navigate","Magnets are harmful to pigeons","Songbirds migrate farther than other birds"],a:1,e:"第一段最後一句就是主旨：birds rely on several cues at once，後面兩段分別說明太陽、星星、磁場。"},
{q:"The word \"precision\" in paragraph 1 is closest in meaning to",o:["speed","accuracy","effort","danger"],a:1,e:"precision = 精確，最接近 accuracy。"},
{q:"Why did the magnets have little effect on sunny days?",o:["The magnets stopped working in sunlight","The pigeons flew shorter distances","The pigeons relied on the sun instead","The scientists removed the magnets"],a:2,e:"文中說 the birds simply switched to using the sun。這是「因果關係」題。"},
{q:"What can be inferred about a pigeon carrying a magnet on a cloudy day?",o:["It would navigate normally","It would be more likely to get lost","It would fly only at night","It would follow other birds"],a:1,e:"推論題：陰天無法用太陽，磁鐵又干擾磁場感應，所以較容易迷路（frequently lost their way）。"}
]},
{title:"Terraced Farming",type:"學術文章",text:"Farming on steep hillsides presents a serious challenge: when heavy rain falls, water rushes downhill and carries away the fertile topsoil that crops need. Over time, this erosion can leave land almost useless for agriculture.\n\nTo solve this problem, farmers in many parts of the world, from the Andes to Southeast Asia, developed terraces, which are flat steps cut into the slope. Each terrace slows the flow of water, giving it time to soak into the ground rather than washing the soil away. As a result, terraces not only protect the soil but also help retain moisture, which is particularly valuable in regions with long dry seasons.\n\nHowever, terraces require substantial labor to build and maintain. If they are neglected, the walls may collapse, causing even worse erosion than before.",
qs:[
{q:"What problem do terraces mainly address?",o:["The loss of topsoil caused by rain","A shortage of farm workers","Pests that damage crops","Cold temperatures in the mountains"],a:0,e:"第一段說明問題：雨水沖走肥沃的表土（erosion），第二段說梯田是解法。"},
{q:"The word \"substantial\" in paragraph 3 is closest in meaning to",o:["little","considerable","skilled","temporary"],a:1,e:"substantial = 大量的、可觀的，最接近 considerable。"},
{q:"According to the passage, what is a disadvantage of terraces?",o:["They reduce the amount of moisture in the soil","They can only be built in Asia","They need a lot of work to build and maintain","They cause more rain to fall"],a:2,e:"第三段：terraces require substantial labor to build and maintain，疏於維護還可能倒塌。"}
]}
]}

let VOICES=[];
function loadVoices(){try{VOICES=window.speechSynthesis?speechSynthesis.getVoices()||[]:[]}catch(e){VOICES=[]}}

function voiceFor(code){const c=code.toLowerCase(),p=c.slice(0,2);
  const m=VOICES.filter(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(p));
  return m.find(v=>v.lang.replace("_","-").toLowerCase()===c&&v.localService)||m.find(v=>v.lang.replace("_","-").toLowerCase()===c)||m[0]||null}
function inAppBrowser(){const u=navigator.userAgent||"";return /Line\/|Instagram|FBAN|FBAV|MicroMessenger/i.test(u)}
function speak(text,lg,quiet){
  lg=lg||lang(); const code=LANGS[lg].voice;
  const _help=showVoiceHelp; const showVoiceHelp=(l,w)=>{if(!quiet)_help(l,w)};
  if(!window.speechSynthesis||typeof SpeechSynthesisUtterance==="undefined"){showVoiceHelp(lg,"nosupport");return}
  loadVoices(); const v=voiceFor(code);
  if(VOICES.length&&!v){showVoiceHelp(lg,"novoice");return}
  try{
    const u=new SpeechSynthesisUtterance(text); u.lang=code; if(v)u.voice=v; u.rate=lg==="en"?.9:.8;
    let started=false; u.onstart=()=>{started=true};
    u.onerror=e=>{if(!started&&e.error!=="interrupted"&&e.error!=="canceled")showVoiceHelp(lg,"error")};
    if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
    speechSynthesis.speak(u);
    if(lg!=="en")setTimeout(()=>{if(!started&&!speechSynthesis.speaking)showVoiceHelp(lg,"silent")},2500);
  }catch(e){showVoiceHelp(lg,"error")}
}
function showVoiceHelp(lg,why){
  const name=LANGS[lg].name, ex=lg==="ja"?"Kyoko、O-Ren":"Yuna、Sora";
  const head=why==="nosupport"?`這個瀏覽器不支援發音功能。`:`你的手機目前沒有可以用的「${name}」語音，所以播不出聲音。`;
  const iab=inAppBrowser()?`<div class="status warn" style="margin-bottom:10px">你現在是在 LINE / IG / FB 裡面開啟網頁，這種內建瀏覽器常常不能發音。請點右上角選單，選「用 Safari / Chrome 開啟」。</div>`:"";
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="sheet"><h2>🔇 ${name}沒有聲音？</h2><p>${head}只要在手機裡下載${name}語音就能解決，下載一次就好。</p>${iab}
  <div class="exp"><b>iPhone / iPad</b>設定 → 輔助使用 → 朗讀內容 → 聲音 → 選「${name}」→ 下載一個聲音（例如 ${ex}）。下載完把網頁關掉再重新打開。</div>
  <div class="exp"><b>Android</b>設定 → 搜尋「文字轉語音」→ 偏好的引擎選「Google 語音服務」→ 點齒輪 ⚙ → 安裝語音資料 → 下載「${name}」。Samsung 手機也請把引擎改成 Google。</div>
  <div class="exp"><b>電腦</b>建議用 Microsoft Edge，內建日文、韓文語音。Windows 也可以到 設定 → 時間與語言 → 語音 → 新增語音。</div>
  <p class="muted small">各品牌、版本的選單名稱可能略有不同。設定好之後，可以到「寵物」頁最下面的「發音檢查」測試。</p>
  <button class="btn" data-close="1">知道了</button></div>`;
  m.addEventListener("click",e=>{if(e.target===m||e.target.dataset.close)m.remove()});
  document.querySelectorAll(".modal").forEach(x=>x.remove()); document.body.appendChild(m);
}

const dayStr=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())};
const today=()=>dayStr(new Date());
function addDays(ds,n){const[y,m,d]=ds.split("-").map(Number);return dayStr(new Date(y,m-1,d+n))}
function daysBetween(a,b){const[y1,m1,d1]=a.split("-").map(Number),[y2,m2,d2]=b.split("-").map(Number);return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/864e5)}

function stageOf(f){let s=0;STAGES.forEach((x,i)=>{if(f>=x.at)s=i});return s}

function evalCat(){
  if(!CAT||CAT.dead) return;
  const t=today(); let d=addDays(CAT.checked,1), changed=false;
  while(d<t){
    if((FED[d]||0)>=GOALN){CAT.miss=0;CAT.streak=(CAT.streak||0)+1}
    else{CAT.miss=(CAT.miss||0)+1;CAT.streak=0;
      if(CAT.miss>=2){CAT.dead=true;CAT.diedOn=d;CATS.push({name:CAT.name,ic:SP().ic,days:daysBetween(CAT.born,d)+1,food:CAT.food,unit:foodN(),stage:stName(stageOf(CAT.food))});changed=true;break}}
    CAT.checked=d; d=addDays(d,1); changed=true;
  }
  if(changed) saveCat();
}
function adopt(name){
  const t=today(), sp=SPECIES[pendingSp];
  CAT={name:(name||sp.def).slice(0,10),sp:pendingSp,born:t,food:0,checked:t,miss:0,streak:0,dead:false};
  saveCat(); adoptNameDraft=null; petLine=`${sp.snd}～你好！答對題目就能餵我吃${sp.food}喔 ${sp.fe}`;
}
function mood(){
  if(!CAT) return "happy";
  if(CAT.dead) return "dead";
  if(fedToday()>=GOALN) return "happy";
  if(CAT.miss>=1) return "weak";
  return "normal";
}
function feed(n){
  if(!n) return;
  if(!CAT){toast("先去「寵物」頁領養一隻寵物，答對就能餵牠 🐾");return}
  if(CAT.dead){toast(`${CAT.name} 回${SP().star}了…去「寵物」頁領養新的寵物吧`);return}
  const t=today(), before=FED[t]||0, s0=stageOf(CAT.food);
  FED[t]=before+n; CAT.food+=n; saveCat(); pendingFly+=n;
  const s1=stageOf(CAT.food);
  if(s1>s0) setTimeout(()=>toast(`🎉 ${CAT.name} 長大了！變成「${stName(s1)}」`),300);
  else if(before<GOALN&&FED[t]>=GOALN) setTimeout(()=>toast(`${SP().ic} ${CAT.name} 今天吃飽了！明天記得再來餵牠`),300);
}
function bubbleText(){
  if(petLine) return petLine;
  const sp=SP(), f=fedToday(), left=GOALN-f, m=mood(), u=sp.unit+sp.food;
  if(m==="happy") return pick([`吃飽飽了，${sp.snd}～`,"今天好幸福！","明天也要來陪我喔",sp.act]);
  if(m==="weak") return f>0?`還差 ${left} ${u}…我好虛弱…`:"好餓…頭好暈…昨天沒吃飽…";
  if(f===0) return pick(["肚子咕嚕咕嚕叫…",`今天還沒吃東西${sp.snd}…`,`答對題目就有${sp.food}吃嗎？`]);
  return pick([`再 ${left} ${u}就飽了！`,"好吃！還要～",`${sp.snd}！再來一題！`]);
}
function petLines(md){const sp=SP();return ({happy:[sp.act,`摸摸好舒服${sp.snd}`,"你今天好認真！"],normal:[`${sp.snd}？要餵我了嗎？`,"摸頭不能當飯吃啦～",`去答題換${sp.food}給我嘛`],weak:["好餓…沒力氣撒嬌了…",`拜託…給我一點${sp.food}…`]})[md]||[`${sp.snd}～`]}

/* ===================== CAT DRAWING ===================== */
function catSVG(s,md,size,spk){
  const sp=SPECIES[spk||curSpKey()]||SPECIES.cat;
  const sc=[.62,.74,.85,.94,1][s], hr=[40,38,35,33,33][s], brx=[30,36,44,50,54][s], bry=[24,29,34,38,40][s];
  const dead=md==="dead", C=sp.c;
  const main=dead?"#cfc9c1":C.main, dark=dead?"#aaa49b":C.dark, cream=dead?"#efece7":C.cream, inner=dead?"#d6d0c8":C.inner, pink="#f6a5b8", ink="#3b2f2b";
  const ol=sp.outline&&!dead?` stroke="#e2d9cc" stroke-width="2.5"`:"";
  const hy=-2*bry-hr*.45; let g="";
  // tail
  if(sp.tail==="long") g+=`<path d="M ${brx-8} -10 C ${brx+28} -6, ${brx+30} -60, ${brx+8} -72" stroke="${main}" stroke-width="12" fill="none" stroke-linecap="round"/>`;
  if(sp.tail==="short") g+=`<path d="M ${brx-10} ${-bry*1.1} q 24 -6 22 -34" stroke="${dark}" stroke-width="11" fill="none" stroke-linecap="round"/>`;
  if(sp.tail==="puff") g+=`<circle cx="${brx-2}" cy="${-bry*.55}" r="11" fill="${sp.panda?dark:cream}"${ol}/>`;
  // body
  g+=`<ellipse cx="0" cy="${-bry}" rx="${brx}" ry="${bry}" fill="${main}"${ol}/>`;
  if(!sp.panda) g+=`<ellipse cx="0" cy="${-bry+5}" rx="${brx*.55}" ry="${bry*.7}" fill="${cream}"/>`;
  if(sp.panda) g+=`<ellipse cx="${-brx*.6}" cy="${-bry*1.15}" rx="${brx*.34}" ry="${bry*.58}" fill="${dark}"/><ellipse cx="${brx*.6}" cy="${-bry*1.15}" rx="${brx*.34}" ry="${bry*.58}" fill="${dark}"/>`;
  if(sp.stripes) g+=`<path d="M ${-brx+5} ${-bry-6} q 7 4 13 0 M ${brx-5} ${-bry-6} q -7 4 -13 0" stroke="${dark}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  const pawC=sp.panda?dark:cream;
  g+=`<ellipse cx="${-brx*.42}" cy="-5" rx="11" ry="7" fill="${pawC}"${sp.panda?"":ol}/><ellipse cx="${brx*.42}" cy="-5" rx="11" ry="7" fill="${pawC}"${sp.panda?"":ol}/>`;
  // back ears
  const earC=sp.panda?dark:main;
  if(sp.ear==="cat"){const ear=sx=>`<path d="M ${sx*hr*.92} ${hy-hr*.2} L ${sx*hr*.62} ${hy-hr*1.2} L ${sx*hr*.12} ${hy-hr*.82} Z" fill="${main}" stroke="${main}" stroke-width="6" stroke-linejoin="round"/><path d="M ${sx*hr*.76} ${hy-hr*.44} L ${sx*hr*.6} ${hy-hr*.98} L ${sx*hr*.32} ${hy-hr*.78} Z" fill="${inner}"/>`;g+=ear(-1)+ear(1)}
  if(sp.ear==="long"){const ear=sx=>`<g transform="rotate(${sx*9} ${sx*hr*.36} ${hy-hr*.7})"><ellipse cx="${sx*hr*.36}" cy="${hy-hr*1.2}" rx="${hr*.22}" ry="${hr*.62}" fill="${main}"${ol}/><ellipse cx="${sx*hr*.36}" cy="${hy-hr*1.18}" rx="${hr*.11}" ry="${hr*.46}" fill="${inner}"/></g>`;g+=ear(-1)+ear(1)}
  if(sp.ear==="round"){const ear=sx=>`<circle cx="${sx*hr*.7}" cy="${hy-hr*.7}" r="${hr*.32}" fill="${earC}"${sp.panda?"":ol}/>${sp.panda?"":`<circle cx="${sx*hr*.7}" cy="${hy-hr*.7}" r="${hr*.17}" fill="${inner}"/>`}`;g+=ear(-1)+ear(1)}
  if(sp.ear==="smallround"){const ear=sx=>`<circle cx="${sx*hr*.62}" cy="${hy-hr*.78}" r="${hr*.23}" fill="${main}"/><circle cx="${sx*hr*.62}" cy="${hy-hr*.78}" r="${hr*.12}" fill="${inner}"/>`;g+=ear(-1)+ear(1)}
  // head
  g+=`<circle cx="0" cy="${hy}" r="${hr}" fill="${main}"${ol}/>`;
  if(sp.ear==="floppy"){const ear=sx=>`<ellipse cx="${sx*hr*.88}" cy="${hy-hr*.02}" rx="${hr*.26}" ry="${hr*.56}" fill="${dark}" transform="rotate(${sx*18} ${sx*hr*.88} ${hy-hr*.02})"/>`;g+=ear(-1)+ear(1)}
  if(sp.stripes) g+=`<path d="M 0 ${hy-hr+4} v 10 M -9 ${hy-hr+6} v 8 M 9 ${hy-hr+6} v 8" stroke="${dark}" stroke-width="4" stroke-linecap="round"/>`;
  if(!sp.panda) g+=`<ellipse cx="0" cy="${hy+hr*.4}" rx="${hr*.44}" ry="${hr*.3}" fill="${cream}"/>`;
  const ex=hr*.42, ey=hy+hr*.02, ny=hy+hr*.28;
  if(sp.cheeks) g+=`<circle cx="${-hr*.62}" cy="${ny+4}" r="${hr*.3}" fill="${cream}"/><circle cx="${hr*.62}" cy="${ny+4}" r="${hr*.3}" fill="${cream}"/>`;
  if(sp.panda&&!dead) g+=`<ellipse cx="${-ex}" cy="${ey+2}" rx="10" ry="13" fill="${dark}" transform="rotate(25 ${-ex} ${ey+2})"/><ellipse cx="${ex}" cy="${ey+2}" rx="10" ry="13" fill="${dark}" transform="rotate(-25 ${ex} ${ey+2})"/>`;
  const eyeC=sp.panda&&!dead?"#fff":ink;
  if(dead) g+=`<path d="M ${-ex-6} ${ey} q 6 5 12 0 M ${ex-6} ${ey} q 6 5 12 0" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  else if(md==="happy") g+=`<path d="M ${-ex-6} ${ey+2} q 6 -9 12 0 M ${ex-6} ${ey+2} q 6 -9 12 0" stroke="${eyeC}" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse cx="${-ex-8}" cy="${ey+13}" rx="7" ry="4" fill="${pink}" opacity=".75"/><ellipse cx="${ex+8}" cy="${ey+13}" rx="7" ry="4" fill="${pink}" opacity=".75"/>`;
  else{const ry=md==="weak"?5:7.5;
    g+=`<ellipse cx="${-ex}" cy="${ey}" rx="6" ry="${ry}" fill="${eyeC}"/><ellipse cx="${ex}" cy="${ey}" rx="6" ry="${ry}" fill="${eyeC}"/>`;
    g+=sp.panda?`<circle cx="${-ex+1}" cy="${ey}" r="3" fill="${ink}"/><circle cx="${ex+1}" cy="${ey}" r="3" fill="${ink}"/>`:`<circle cx="${-ex+2}" cy="${ey-3}" r="2.2" fill="#fff"/><circle cx="${ex+2}" cy="${ey-3}" r="2.2" fill="#fff"/>`;
    if(md==="weak") g+=`<path d="M ${-ex-9} ${ey-14} l 13 5 M ${ex+9} ${ey-14} l -13 5" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/><path d="M ${ex+8} ${ey+5} q 3 6 0 9 q -3 -3 0 -9" fill="#7dd3fc"/>`;}
  g+=sp.darkNose?`<ellipse cx="0" cy="${ny+2}" rx="6.5" ry="4.5" fill="${ink}"/>`:`<path d="M -4.5 ${ny} h 9 l -4.5 5 z" fill="${pink}"/>`;
  g+=(md==="weak"||dead)?`<path d="M -6 ${ny+13} q 6 -5 12 0" stroke="${ink}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
                        :`<path d="M 0 ${ny+6} q -4 6 -9 2 M 0 ${ny+6} q 4 6 9 2" stroke="${ink}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if(sp.teeth&&!dead) g+=`<rect x="-3.5" y="${ny+8}" width="7" height="6" rx="1.5" fill="#fff" stroke="#e2d9cc" stroke-width="1"/>`;
  if(sp.whiskers) g+=`<path d="M ${-hr*.46} ${ny+2} l ${-hr*.5} -4 M ${-hr*.46} ${ny+7} l ${-hr*.5} 3 M ${hr*.46} ${ny+2} l ${hr*.5} -4 M ${hr*.46} ${ny+7} l ${hr*.5} 3" stroke="${ink}" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>`;
  if(s>=2&&!dead) g+=`<path d="M ${-hr*.62} ${hy+hr*.86} q ${hr*.62} ${hr*.32} ${hr*1.24} 0" stroke="#e11d48" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="0" cy="${hy+hr*1.04}" r="6" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>`;
  if(s>=4&&!dead) g+=`<path d="M -18 ${hy-hr+3} l 0 -20 l 9 10 l 9 -16 l 9 16 l 9 -10 l 0 20 z" fill="#facc15" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round"/>`;
  if(dead) g+=`<ellipse cx="0" cy="${hy-hr-(sp.ear==="long"?40:16)}" rx="${hr*.6}" ry="7" fill="none" stroke="#facc15" stroke-width="4"/>`;
  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}" aria-hidden="true"><ellipse cx="100" cy="187" rx="${brx*sc*1.25}" ry="7" fill="rgba(0,0,0,.08)"/><g transform="translate(100 185) scale(${sc})">${g}</g></svg>`;
}

/* ===================== HEADER / NAV ===================== */
function renderHeader(){
  const f=fedToday();
  let mini;
  if(!CAT) mini=`<button class="mini" data-act="tab" data-k="cat"><span class="mc">${catSVG(0,"happy",58)}</span><span class="mt"><span class="mn">去領養一隻寵物吧 🐾</span><span class="muted small">答對題目就能餵牠</span></span></button>`;
  else if(CAT.dead) mini=`<button class="mini warn" data-act="tab" data-k="cat"><span class="mc">${catSVG(stageOf(CAT.food),"dead",48)}</span><span class="mt"><span class="mn">${esc(CAT.name)} 回${SP().star}了</span><span class="muted small">點這裡領養新的寵物</span></span></button>`;
  else{const s=stageOf(CAT.food),warn=CAT.miss>=1&&f<GOALN;
    mini=`<button class="mini ${warn?"warn":""}" data-act="tab" data-k="cat"><span class="mc">${catSVG(s,mood(),58)}</span><span class="mt"><span class="mn">${esc(CAT.name)}<small>${stName(s)}${warn?" · 好餓！":""}</small></span><span class="mb"><i style="width:${Math.min(100,f/GOALN*100)}%"></i></span></span><span class="mf" id="miniFish">${SP().fe} ${Math.min(f,GOALN)}/${GOALN}</span></button>`;}
  let row2="";
  if(tab!=="cat"){
    const L=LANGS[lang()];
    row2=`<div class="trackrow"><button class="langchip" data-act="tab" data-k="cat">${L.badge} ${L.name} ▾</button>`+
      (L.tracks.length>1?`<div class="seg">${L.tracks.map(k=>`<button class="${k===track?"on":""}" data-act="track" data-k="${k}">${TRACKS[k].short}</button>`).join("")}</div>`
                         :`<span class="tracklabel">零基礎入門</span>`)+`</div>`;
  }
  $("#hdr").innerHTML=`<div class="top">${mini}<button class="timer ${tRun?"running":""}" id="timer" data-act="timer">${tRun?"⏸ ":"⏱ "}${fmt(tLeft)}</button></div>${row2}`;
}
function renderNav(){
  const items=[{k:"cat",ic:SP().ic,l:"寵物"}].concat(SECTIONS[lang()]);
  $("#tabs").innerHTML=items.map(x=>`<button class="${x.k===tab?"on":""}" data-act="tab" data-k="${x.k}"><span class="ic">${x.ic}</span>${x.l}</button>`).join("");
}
function render(){
  evalCat();
  if(tab!=="cat"&&!SECTIONS[lang()].some(x=>x.k===tab)) tab=SECTIONS[lang()][0].k;
  document.body.dataset.theme=tab==="cat"?"cat":track;
  document.body.dataset.lang=lang();
  renderHeader(); renderNav();
  const inLesson=tab!=="cat"&&LS&&LS.t===track, inPlace=tab!=="cat"&&(!lvOf().placed||(PL&&PL.t===track));
  document.body.dataset.mode=inLesson?"lesson":"";
  $("#main").innerHTML= tab==="cat"?renderHome(): inPlace?renderPlacement(): inLesson?renderLesson(): STORY?renderReading(): tab==="review"?renderReview(): tab==="book"?renderBook(): renderPath();
  if(pendingFly){flyFish(pendingFly);pendingFly=0}
  if(tab==="path"&&scrollToCur&&!inLesson&&!inPlace&&!STORY){scrollToCur=false;const c=document.querySelector(".node.cur");if(c)setTimeout(()=>c.scrollIntoView({block:"center"}),30)}
}
function flyFish(n){
  const m=document.getElementById("miniFish"); if(!m) return;
  const r=m.getBoundingClientRect(), f=document.createElement("div");
  f.className="fly"; f.textContent="+"+n+" "+SP().fe; f.style.left=(r.left+4)+"px"; f.style.top=(r.bottom+2)+"px";
  document.body.appendChild(f); setTimeout(()=>f.remove(),1100);
  const mc=document.querySelector(".mini .mc"); if(mc) mc.classList.add("hop");
}

/* ===================== HOME (CAT) ===================== */
function langTiles(){
  return Object.keys(LANGS).map(l=>{const L=LANGS[l];let kn=0,tot=0;
    L.tracks.forEach(t=>{const tr=TRACKS[t],pk=prog(t).known;Object.keys(tr.decks).forEach(d=>{tot+=tr.decks[d].items.length;kn+=d==="vocab"?(SR[t]?srsStats(t).known:(pk.vocab||[]).length):(pk[d]||[]).length})});
    return `<button class="tile" data-act="lang" data-k="${l}"><span class="badge" style="background:${L.color}">${L.badge}</span><span class="tt"><b>${L.name} <span class="lvmini">Lv${Math.max(...L.tracks.map(t=>lvOf(t).lv))}</span></b><small>${L.desc}</small></span><span class="tp">已記住<br><b style="font-size:1rem;color:var(--ink)">${kn}/${tot}</b></span></button>`}).join("");
}
function spPicker(cur,act){
  return `<div class="sppick">${Object.keys(SPECIES).map(k=>{const x=SPECIES[k];return `<button class="spbtn ${k===cur?"on":""}" data-act="${act}" data-k="${k}">${catSVG(2,"happy",76,k)}<b>${x.n}</b><small>吃${x.food}${x.fe}</small></button>`}).join("")}</div>`}
function adoptForm(title,desc){
  return `<h2 style="margin-top:14px">${title}</h2><p class="muted" style="margin:0 0 8px">先選一種動物：</p>${spPicker(pendingSp,"pickSp")}<p class="muted" style="margin:10px 0 0">${desc}</p>
  <input id="catName" class="inp" maxlength="10" placeholder="幫牠取個名字" value="${esc(adoptNameDraft!==null?adoptNameDraft:SPECIES[pendingSp].def)}">
  <button class="btn" data-act="adopt" style="margin-top:10px">領養 🐾</button>`;
}
function rulesText(){const sp=SP();return `每答對一題，就能餵牠一${sp.unit}${sp.food} ${sp.fe}。每天餵飽 ${GOALN} ${sp.unit}，牠會慢慢長大；一天沒吃飽牠會變虛弱，<b>連續兩天沒吃飽就會餓死</b>。`}
function renderHome(){
  const settings=`<div class="card"><h2>每天要餵幾${foodN()}？</h2><p class="muted" style="margin:0">也就是每天要答對幾題。設得少一點，比較容易每天都做到。</p>
    <div class="chips">${GOAL_OPTS.map(n=>`<button class="chip ${n===GOALN?"on":""}" data-act="goal" data-k="${n}">${n} 題</button>`).join("")}</div>
    
    ${CAT&&!CAT.dead?`<h2 style="margin-top:20px">想從頭開始養？</h2><p class="muted" style="margin:0">只想換動物的話，按名字旁邊的 🔄 就好。想要重新取名、從寶寶開始養，可以把現在的寵物送到新家（會記在回憶錄裡，學習進度不受影響）。</p>
    <div class="btns"><button class="btn ghost" data-act="rehome">${rehomeArmed?`再按一次，確認把 ${esc(CAT.name)} 送到新家`:"重新領養一隻新寵物"}</button></div>`:""}
    <div class="btns"><button class="btn ghost" data-act="reset">${resetArmed?"再按一次，確認清除所有學習進度":"清除學習進度（寵物不受影響）"}</button></div></div>`+voiceCheckCard();
  const memorial=CATS.length?`<div class="card"><h2>📖 寵物回憶錄</h2>${CATS.map(c=>`<div class="row between small" style="padding:6px 0;border-top:1px solid var(--line)"><span>${c.ic||"🐱"} ${esc(c.name)}（${c.stage}${c.rehomed?"・送到新家":""}）</span><span class="muted">陪你 ${c.days} 天 · 吃了 ${c.food} ${(c.unit||"條魚").slice(1)}</span></div>`).join("")}</div>`:"";
  if(!CAT){
    return `<div class="card"><div class="room"><div class="window"></div><div class="plant">🪴</div><div class="bubble">帶我回家好不好？${SP().snd}～</div><div class="catwrap">${catSVG(0,"normal",210)}</div></div>
      ${adoptForm("領養一隻寵物吧！",rulesText())}</div>`+settings;
  }
  if(CAT.dead){
    const days=daysBetween(CAT.born,CAT.diedOn)+1;
    return `<div class="card"><div class="room dead"><div class="window"></div><div class="bubble">謝謝你陪我 ${days} 天…</div><div class="catwrap">${catSVG(stageOf(CAT.food),"dead",210)}</div></div>
      <div class="catname">${esc(CAT.name)} 回${SP().star}了 😢</div>
      <p class="muted" style="text-align:center;margin:4px 0 0">牠連續兩天沒吃飽，撐不下去了。<br>牠總共吃了 ${CAT.food} ${SP().unit}${SP().food}，長到「${stName(stageOf(CAT.food))}」。</p>
      ${adoptForm("再領養一隻寵物",rulesText())}</div>`+memorial+settings;
  }
  const f=fedToday(), s=stageOf(CAT.food), age=daysBetween(CAT.born,today())+1, md=mood(), nx=STAGES[s+1];
  const warn=CAT.miss>=1&&f<GOALN;
  const status= f>=GOALN?`${SP().ic} 今天吃飽了！明天記得再來餵 ${esc(CAT.name)}。想多練習的話，多答對的${SP().food}會幫牠長得更快。`
              : warn?`⚠️ 昨天沒吃飽，${esc(CAT.name)} 很虛弱。今天再沒吃飽，牠就會餓死！還差 ${GOALN-f} 題。`
              : `還要答對 ${GOALN-f} 題，${esc(CAT.name)} 今天才會吃飽。`;
  const nameRow=renaming?`<div class="row" style="margin-top:12px"><input id="renameInp" class="inp" style="margin:0" maxlength="10" value="${esc(CAT.name)}"><button class="btn" style="width:auto" data-act="renameSave">儲存</button></div>`
                        :`<div class="catname">${esc(CAT.name)} <button class="mini-btn" data-act="rename" aria-label="改名字">✏️</button><button class="mini-btn" data-act="swapOpen" aria-label="換動物">🔄</button></div>`;
  const swapper=swapOpen?`<div style="margin-top:10px"><div class="muted small" style="text-align:center">選一個新造型（名字、成長和飯量都會保留）</div>${spPicker(CAT.sp||"cat","swapSp")}</div>`:"";
  const growth=nx?`<div class="row between"><b>成長</b><span class="muted small">${stName(s)} → ${stName(s+1)}</span></div>
      <div class="bar"><i style="width:${(CAT.food-STAGES[s].at)/(nx.at-STAGES[s].at)*100}%"></i></div>
      <div class="muted">再吃 <b>${nx.at-CAT.food}</b> ${SP().unit}${SP().food}，就會長成「${stName(s+1)}」</div>`
     :`<div class="row between"><b>成長</b><span class="pill">👑 已經是${stName(4)}</span></div><div class="muted" style="margin-top:6px">牠已經長到最大了，繼續每天餵飽牠吧！</div>`;
  const streak=(CAT.streak||0)+(f>=GOALN?1:0);
  return `<div class="card"><div class="room"><div class="window"></div><div class="plant">🪴</div><div class="bubble">${bubbleText()}</div>
      <div class="catwrap" data-act="pet">${catSVG(s,md,s>=3?230:210)}</div><div class="bowl">${SP().fe} ${f}</div></div>
    ${nameRow}${swapper}<div class="row center" style="margin-top:4px"><span class="pill">${stName(s)}</span><span class="muted">陪你第 ${age} 天</span></div></div>
  <div class="card"><div class="row between"><b>今天的飯量</b><span style="font-weight:700">${SP().fe} ${Math.min(f,GOALN)} / ${GOALN}</span></div>
    <div class="bar food ${warn?"warn":""}"><i style="width:${Math.min(100,f/GOALN*100)}%"></i></div>

let LVS=store.get("es_lv",{});
const MAXLV=5;
function lvOf(t){t=t||track;if(!LVS[t])LVS[t]={lv:1,h:[],tp:{}};return LVS[t]}
function saveLV(){store.set("es_lv",LVS)}
function wordTier(t,w){const items=TRACKS[t].decks.vocab.items,i=items.findIndex(x=>x.w===w);return i<0?1:1+Math.floor(i/Math.ceil(items.length/MAXLV))}
function sinceMark(L){let i=L.h.length-1;while(i>=0&&!L.h[i].mark)i--;return L.h.slice(i+1)}
function levelStats(t){const L=lvOf(t),at=sinceMark(L).filter(x=>x.l>=L.lv).slice(-12),ok=at.filter(x=>x.o).length;return {n:at.length,ok,acc:at.length?ok/at.length:0}}
function record(ok,lv,topic){
  const L=lvOf();L.h.push({o:ok?1:0,l:lv||1});if(L.h.length>60)L.h=L.h.slice(-60);
  if(topic){const tp=L.tp[topic]||(L.tp[topic]=[0,0]);tp[1]++;if(ok)tp[0]++}
  const st=levelStats(track);
  if(ok&&st.n>=12&&st.acc>=0.8&&L.lv<MAXLV){L.lv++;L.h.push({o:1,l:0,mark:1});setTimeout(()=>toast(`⬆️ 升級到 Lv${L.lv}！解鎖了更難的題目`),900)}
  else if(!ok){const last=sinceMark(L).slice(-10);if(L.lv>1&&last.length>=10&&last.filter(x=>x.o).length<4){L.lv--;L.h.push({o:1,l:0,mark:1});setTimeout(()=>toast(`先退回 Lv${L.lv}，把基礎打穩 💪`),900)}}
  saveLV();
}
function weakTopics(t){const tp=lvOf(t).tp;return Object.keys(tp).filter(k=>tp[k][1]>=2&&tp[k][0]/tp[k][1]<0.6)}
function levelCard(){
  const L=lvOf(),st=levelStats(track),need=Math.max(0,12-st.n);
  const msg=L.lv>=MAXLV?"已經是最高等級，繼續保持！":st.n<12?`本級再答 ${need} 題後，答對率達 80% 就升級`:`本級最近 12 題答對率 ${Math.round(st.acc*100)}%，達 80% 就升級`;
  return `<div class="lvcard"><span class="lvbadge">Lv${L.lv}</span><div class="lvt"><div class="row between" style="margin-bottom:2px"><span class="small" style="font-weight:700">${(LV_DESC[lang()][L.lv-1]||"").split("：")[0]}</span><button class="chip" style="padding:2px 10px;font-size:.8rem" data-act="plRedo">重新測驗</button></div><div class="lvbar"><i style="width:${L.lv>=MAXLV?100:Math.min(100,st.n?st.acc/0.8*100*Math.min(1,st.n/12):0)}%"></i></div><div class="muted small">${msg}</div></div></div>`;
}
function weightedPick(items,wfn,n){const pool=items.map(x=>({x,w:wfn(x)})).filter(o=>o.w>0),out=[];
  while(out.length<n&&pool.length){const tot=pool.reduce((a,o)=>a+o.w,0);let r=Math.random()*tot,i=0;for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}out.push(pool.splice(Math.min(i,pool.length-1),1)[0].x)}return out}

function vocabQ(t,it,items){const opts=shuffle([it,...shuffle(items.filter(x=>x.w!==it.w&&x.m!==it.m)).slice(0,3)]);
  return {kind:"v",pr:"這個字是什麼意思？",big:it.w,sub:it.p&&lang()!=="en"?it.p:(it.p||""),opts:opts.map(o=>o.m),a:opts.indexOf(it)}}
function buildPlacement(t){
  const tr=TRACKS[t], items=tr.decks.vocab.items, out=[];
  for(let L=1;L<=MAXLV;L++){
    const qs=[];
    if(L===1&&tr.decks.letters){const li=tr.decks.letters.items,it=pick(li),opts=shuffle([it,...shuffle(li.filter(x=>x.m!==it.m)).slice(0,3)]);
      qs.push({kind:"l",pr:tr.decks.letters.qA,big:it.w,sub:"",opts:opts.map(o=>o.m),a:opts.indexOf(it)})}
    const gs=shuffle(tr.grammar.filter(q=>(q.lv||1)===L)).slice(0,lang()==="en"?1:2).map(q=>{const order=shuffle(q.o.map((_,i)=>i));return {kind:"g",pr:q.q,big:"",sub:q.t,opts:order.map(i=>q.o[i]),a:order.indexOf(q.a)}});
    qs.push(...gs);
    const tier=items.filter(x=>wordTier(t,x.w)===L);
    shuffle(tier).slice(0,3-qs.length).forEach(it=>qs.push(vocabQ(t,it,items)));
    out.push(shuffle(qs).map(q=>Object.assign(q,{lv:L})));

}

function saveSRS(){store.set("es_srs",SR)}
function srsOf(t){
  t=t||track;
  if(!SR[t]){const S={u:[],day:"",c:{}},kn=(prog(t).known.vocab||[]),td=today();
    TRACKS[t].decks.vocab.items.forEach(it=>{if(kn.includes(it.w)){S.u.push(it.w);S.c[it.w]={b:2,d:addDays(td,3),s:true}}});
    SR[t]=S;saveSRS()}

}
function unlockN(t,n){const S=srsOf(t),td=today(),items=TRACKS[t].decks.vocab.items,minT=Math.max(1,lvOf(t).lv-1);let k=0;
  const order=items.filter(it=>wordTier(t,it.w)>=minT).concat(items);
  for(const it of order){if(k>=n)break;if(!S.c[it.w]){S.u.push(it.w);S.c[it.w]={b:0,d:td,s:false};k++}}
  saveSRS();return k}
function reviewAcc(t){const r=(srsOf(t).r||[]).slice(-30);return {n:r.length,acc:r.length?r.filter(Boolean).length/r.length:0}}
function adaptiveNew(t){const ra=reviewAcc(t);if(ra.n>=10&&ra.acc>=0.9)return Math.round(DAILY_NEW*1.5);if(ra.n>=10&&ra.acc<0.7)return Math.max(3,Math.round(DAILY_NEW*0.5));return DAILY_NEW}
function dailyUnlock(t){const S=srsOf(t),td=today();if(S.day===td)return;
  const unseen=S.u.filter(w=>!S.c[w].s).length;S.today=adaptiveNew(t);unlockN(t,Math.max(0,S.today-unseen));S.day=td;saveSRS()}
function srsStats(t){const S=srsOf(t),td=today(),items=TRACKS[t].decks.vocab.items;
  let due=0,nw=0,mast=0,learn=0,known=0;

  return {due,nw,mast,learn,known,unlocked:S.u.length,total:items.length}}

  const out=[];
  if(node.type==="lesson"&&node.part<2)focus.filter(it=>!seen(it.w)).forEach(it=>out.push(exMCQ(it,all,letters,true)));
  const nG=u.grammar.length?(node.type==="review"?Math.min(3,u.grammar.length):node.part===2?Math.min(2,u.grammar.length):1):0;
  shuffle(u.grammar).slice(0,nG).forEach(i=>out.push(exGRAM(i)));
  const target=node.type==="review"?12:10;
  if(focus.length>=4)out.push(exMATCH(focus));
  out.push(...wordExercises(focus.length?focus:ws,all,letters,Math.max(0,target-out.length)));
  const head=out.filter(e=>e.isNew), rest=shuffle(out.filter(e=>!e.isNew));
  return head.concat(rest).slice(0,target+2);
}
function buildJump(t,fromIdx,toIdx){
  const f=flatNodes(t).slice(fromIdx,toIdx), units=[...new Map(f.map(x=>[x.u.id,x.u])).values()];
  const out=[];
  units.forEach(u=>{const letters=!!u.letters,all=deckItems(t,letters),ws=u.words.map(w=>itemOf(t,w,letters)).filter(Boolean);
    if(ws.length)out.push(...wordExercises(ws,all,letters,2));u.grammar.slice(0,1).forEach(i=>out.push(exGRAM(i)))});
  return shuffle(out).slice(0,12);
}
function buildReview(t,mode){
  const S=srsOf(t), all=deckItems(t,false), td=today(); let ws, out=[];
  if(mode==="mist"){const M=mistOf(t);ws=M.w.map(w=>itemOf(t,w,false)).filter(Boolean);out.push(...shuffle(M.g).slice(0,4).map(i=>exGRAM(i)))}
  else{ws=S.u.filter(w=>S.c[w].s&&S.c[w].d<=td).map(w=>itemOf(t,w,false)).filter(Boolean);
    if(!ws.length)ws=shuffle(S.u.filter(w=>S.c[w].s).map(w=>itemOf(t,w,false)).filter(Boolean)).slice(0,10)}
  shuffle(ws).slice(0,12).forEach(it=>{const e=wordExercises([it],all,false,1)[0]||exMCQ(it,all,false);out.push(e)});
  return shuffle(out).slice(0,14);
}

function startNode(id){
  const f=flatNodes(track),i=f.findIndex(x=>x.n.id===id),cur=curIndex(track);
  if(i<0)return;
  if(i>cur){toast("🔒 先完成前面的關卡，或用「跳到這裡」測驗");return}
  const x=f[i];
  if(x.n.type==="story"){STORY={id,ri:x.n.ri,redo:!!pathOf().done[id]};R={open:x.n.ri,ans:{},done:false,roma:false,zh:false};window.scrollTo(0,0);return}
  if(hearts()<=0){toast(`❤️ 愛心用完了！做一次複習可以補 1 顆，或等 ${nextHeartMin()} 分鐘`);return}
  const q=buildLesson(track,x.u,x.n);
  if(!q.length){pathOf().done[id]=1;savePath();toast("這關沒有題目，已自動通過");return}
  LS={t:track,mode:"lesson",id,u:x.u.id,nodeType:x.n.type,q,i:0,total:q.length,good:0,wrong:0,fed:0,fb:null,again:new Set(),noAudio:false};
  window.scrollTo(0,0);
}
function startJump(unitId){
  const f=flatNodes(track),cur=curIndex(track),to=f.findIndex(x=>x.u.id===unitId);
  const q=buildJump(track,cur,to);
  if(q.length<4){markUpTo(track,to);toast("已跳到這個單元！");return}
  LS={t:track,mode:"jump",to,q,i:0,total:q.length,good:0,wrong:0,strikes:0,fed:0,fb:null,again:new Set(),noAudio:false};window.scrollTo(0,0);
}
function startReview(mode){
  const q=buildReview(track,mode);
  if(!q.length){toast(mode==="mist"?"目前沒有錯題，太棒了！":"先在路線上完成幾關，才有單字可以複習");return}
  LS={t:track,mode:mode==="mist"?"mist":"review",q,i:0,total:q.length,good:0,wrong:0,fed:0,fb:null,again:new Set(),noAudio:false};window.scrollTo(0,0);
}
function exCorrect(ex){LS.good++;
  if(!LS.again.has(ex)){feed(1);LS.fed++}
  if(LS.mode==="mist")delMist(ex.key);
  if((LS.mode==="review"||LS.mode==="mist")&&ex.key&&ex.key.k==="w"){const S=srsOf(),c=S.c[ex.key.v];if(c&&!LS.again.has(ex)){c.b=Math.min(5,(c.b||1)+1);c.d=addDays(today(),INT[c.b]);S.r=(S.r||[]).concat(1).slice(-60);saveSRS()}}
}
function exWrong(ex){LS.wrong++;addMist(ex.key);
  if(LS.mode==="lesson")loseHeart();
  if(LS.mode==="jump")LS.strikes++;
  if((LS.mode==="review"||LS.mode==="mist")&&ex.key&&ex.key.k==="w"){const S=srsOf(),c=S.c[ex.key.v];if(c){c.b=1;c.d=addDays(today(),1);S.r=(S.r||[]).concat(0).slice(-60);saveSRS()}}
  if(!LS.again.has(ex)&&LS.mode!=="jump"){LS.again.add(ex);LS.q.push(ex)}
}
function answerChoice(k){const ex=LS.q[LS.i];if(LS.fb)return;ex.picked=k;const ok=k===ex.a;
  if(ok)exCorrect(ex);else exWrong(ex);
  LS.fb={ok,ans:ex.ans,note:ex.note||(ex.it&&ex.type!=="mcq"&&ex.type!=="trans"?`${ex.it.w}${ex.it.p&&lang()!=="en"?"（"+ex.it.p+"）":""}：${ex.it.m}`:"")};
  if(ok&&ex.say&&lang()!=="en"&&ex.type!=="listen")try{speak(ex.say,null,true)}catch(e){}
}
function checkBuild(){const ex=LS.q[LS.i];if(LS.fb||!ex.sel.length)return;
  const got=norm(ex.sel.map(i=>ex.tiles[i]).join(" ")),want=norm(ex.answer.join(" "));const ok=got===want;
  if(ok)exCorrect(ex);else exWrong(ex);LS.fb={ok,ans:ex.ans,note:ok?"":"中文："+ex.big};}
function matchTap(side,k){const ex=LS.q[LS.i];if(LS.fb)return;
  if(side==="L"){if(ex.done.includes(ex.L[k]))return;ex.selL=k;return}
  if(ex.selL===null)return;const w=ex.L[ex.selL],it=ex.its.find(x=>x.w===w);
  if(it.m===ex.R[k]){ex.done.push(w);ex.selL=null;if(lang()!=="en")try{speak(it.say||it.w,null,true)}catch(e){}
    if(ex.done.length===ex.its.length){LS.good++;if(!LS.again.has(ex)){feed(1);LS.fed++}LS.fb={ok:true,ans:"",note:ex.bad?`配對錯了 ${ex.bad} 次，再加油！`:"全部配對正確！"}}}
  else{ex.bad++;ex.flash=k;ex.selL=null}
}
function lsNext(){
  if(LS.mode==="lesson"&&hearts()<=0&&!LS.fb.ok){LS.result="nohearts";return}
  if(LS.mode==="jump"&&LS.strikes>=3){LS.result="jumpfail";return}
  LS.fb=null;LS.i++;
  if(LS.i>=LS.q.length)finishSession();
}
function finishSession(){
  const perfect=LS.wrong===0;let xp=0;
  if(LS.mode==="lesson"){
    xp=(LS.nodeType==="review"?15:10)+(perfect?5:0);
    const P=pathOf();P.done[LS.id]=1;savePath();
    const u=flatNodes(track).find(x=>x.u.id===LS.u).u;
    if(!u.letters){const S=srsOf(),td=today();u.words.forEach(w=>{if(!S.c[w]){S.u.push(w);S.c[w]={b:1,d:addDays(td,1),s:true}}else if(!S.c[w].s){S.c[w].s=true;S.c[w].b=1;S.c[w].d=addDays(td,1)}});saveSRS()}
    else{const k=prog().known.letters||(prog().known.letters=[]);u.words.forEach(w=>{if(!k.includes(w))k.push(w)});save()}
    syncLevel(track);
  }else if(LS.mode==="jump"){xp=20;markUpTo(track,LS.to)}
  else{xp=5+(perfect?5:0);gainHeart(1)}
  addXP(xp);LS.xp=xp;LS.result="done";
}

    case "pet": {petLine=pick(petLines(mood()));render();const c=$(".catwrap");if(c)c.classList.add("hop");return}
    case "adopt": doAdopt(); return;
    case "pickSp": {const i=$("#catName");if(i&&i.value!==SPECIES[pendingSp].def)adoptNameDraft=i.value;pendingSp=k;keepScroll=true;break}
    case "rehome": if(!rehomeArmed){rehomeArmed=true;keepScroll=true}else{CATS.push({name:CAT.name,ic:SP().ic,days:daysBetween(CAT.born,today())+1,food:CAT.food,unit:foodN(),stage:stName(stageOf(CAT.food)),rehomed:true});pendingSp=CAT.sp||"cat";CAT=null;saveCat();rehomeArmed=false;swapOpen=false;window.scrollTo(0,0);toast("🏡 牠到新家了，會過得很好！現在可以領養新寵物")} break;
    case "node": startNode(k); break;
    case "jumpUnit": startJump(k); break;
    case "lsPick": answerChoice(+k); break;
    case "lsSay": {const ex=LS.q[LS.i];speak(ex.say||ex.ans);return}
    case "lsNoAudio": {LS.noAudio=true;const ex=LS.q[LS.i],lt=!!(TRACKS[track].decks.letters&&TRACKS[track].decks.letters.items.includes(ex.it));LS.q[LS.i]=exMCQ(ex.it,deckItems(track,lt),lt);break}
    case "bTile": {const ex=LS.q[LS.i];if(!ex.sel.includes(+k))ex.sel.push(+k);if(lang()!=="en")try{speak(ex.tiles[+k],null,true)}catch(e){};break}
    case "bSel": LS.q[LS.i].sel.splice(+k,1); break;
    case "bCheck": checkBuild(); break;
    case "mL": matchTap("L",+k); break;
    case "mR": matchTap("R",+k); break;
    case "lsNext": lsNext(); window.scrollTo(0,0); break;
    case "lsQuit": if(!quitArmed){quitArmed=true;break} quitArmed=false; LS=null; scrollToCur=true; toast("已離開，這關的進度不會保存"); break;
    case "lsEnd": LS=null; scrollToCur=true; window.scrollTo(0,0); break;
    case "goReview": LS=null; tab="review"; store.set("es_tab2",tab); break;
    case "revStart": startReview("due"); break;
    case "mistStart": startReview("mist"); break;
    case "plStart": startPlacement(); break;
    case "plSkip": skipPlacement(+k); resetSession(); toast(`從 Lv${k} 開始學習！`); break;
    case "plPick": {const q=PL.lvls[PL.L-1][PL.i];PL.picked=+k;(PL.res[PL.L]=PL.res[PL.L]||[]).push(+k===q.a);keepScroll=true;break}
    case "plNext": plNext(); break;
    case "plDone": PL=null; resetSession(); tab="path"; scrollToCur=true; window.scrollTo(0,0); break;
    case "plRedo": lvOf().placed=null; saveLV(); PL=null; window.scrollTo(0,0); break;
    case "swapOpen": swapOpen=!swapOpen; keepScroll=true; break;
    case "swapSp": CAT.sp=k; saveCat(); swapOpen=false; petLine=`${SPECIES[k].snd}～我換新造型了！`; keepScroll=true; break;
    case "rename": renaming=true; render(); const ri=$("#renameInp"); if(ri) ri.focus(); return;
    case "renameSave": doRename(); return;
    case "goal": GOALN=+k; store.set("es_goal",GOALN); toast(`每天的目標改成 ${GOALN} 題`); keepScroll=true; break;
    case "reset": keepScroll=true; if(!resetArmed){resetArmed=true} else {P={};save();SR={};saveSRS();LVS={};saveLV();resetArmed=false;resetSession();toast("已清除學習進度")} break;
    case "vmode": V.mode=k; if(k==="quiz") V.quiz=null; else buildOrder(); break;
    case "speak": {ev.stopPropagation();const c=(tab==="vocab"&&V.sess)?itemByW(V.sess.q[V.sess.i].w):V.order[V.i];speak(k==="w"?(c.say||c.w):(c.sayEx||c.ex));return}
    case "flip": V.flip=!V.flip; $(".flip").classList.toggle("on",V.flip); $(".hint").textContent=V.flip?"你剛才想的對嗎？":"先在心裡想答案，再點卡片翻面"; return;
    case "vmark": {const w=V.order[V.i].w,kn=knownArr(),idx=kn.indexOf(w);if(k==="1"&&idx<0)kn.push(w);if(k==="0"&&idx>=0)kn.splice(idx,1);save();V.i++;V.flip=false;break}
    case "vrestart": buildOrder(); break;
    case "smode": V.smode=k; V.sess=null; V.quiz=null; break;
    case "sstart": startSess(); break;
    case "sans": srsAnswer(k==="1"); break;
    case "sdone": V.sess=null; break;
    case "smore": {const got=unlockN(track,5);toast(got?`解鎖了 ${got} 個新字！`:"所有單字都解鎖了 👏");startSess();break}
    case "speakw": speak(k); return;
    case "vtest": speak(k==="ja"?"こんにちは。ねこが すきです。":k==="ko"?"안녕하세요. 고양이를 좋아해요.":"Hello! I love cats.",k); setTimeout(()=>{if(tab==="cat")render()},800); return;
    case "dnew": DAILY_NEW=+k; store.set("es_daily_new",DAILY_NEW); toast(`每天解鎖 ${DAILY_NEW} 個新單字`); keepScroll=true; break;
    case "vqnew": newVQuiz(); break;
    case "vqpick": {const Q=V.quiz,it=Q.items[Q.i];Q.picked=+k;const ok=+k===it.a;if(ok){Q.score++;feed(1)}else Q.wrong.push(it.w);if(tab==="vocab")record(ok,wordTier(track,it.w),null);keepScroll=true;break}
    case "vqnext": V.quiz.i++; V.quiz.picked=null; break;
    case "gpick": {const q=TRACKS[track].grammar[G.list[G.i]];G.picked=+k;const ok=+k===q.a;if(ok){G.score++;feed(1)}else G.wrong.push(G.list[G.i]);record(ok,q.lv||1,q.t);keepScroll=true;break}
    case "gnext": G.i++; G.picked=null;
      break;
    case "gnew": newG(); break;
    case "gwrong": newG(shuffle(G.wrong)); break;
    case "ropen": R={open:+k,ans:{},done:false,roma:false,zh:false}; window.scrollTo(0,0); break;
    case "rback": R={open:null,ans:{},done:false,roma:false,zh:false}; if(STORY){STORY=null;scrollToCur=true} window.scrollTo(0,0); break;
    case "rpick": R.ans[+el.dataset.q]=+k; keepScroll=true; break;
    case "rroma": R.roma=!R.roma; keepScroll=true; break;
    case "rzh": R.zh=!R.zh; keepScroll=true; break;
    case "rspeak": speak(TRACKS[track].reading[R.open].text.replace(/\n/g," ")); return;
    case "rsubmit": {R.done=true;const p=TRACKS[track].reading[R.open],sc=p.qs.filter((q,i)=>R.ans[i]===q.a).length;prog().read[R.open]=sc;save();feed(sc);if(STORY&&!STORY.redo){pathOf().done[STORY.id]=1;savePath();addXP(10);syncLevel(track);STORY.redo=true;setTimeout(()=>toast("📖 故事完成！+10 XP"),300)}keepScroll=true;break}
    case "rretry": R.ans={}; R.done=false; window.scrollTo(0,0); break;
  }
  const y=window.scrollY; render(); if(keepScroll) window.scrollTo(0,y);
});
render();
setInterval(()=>{const d=today();if(d!==window._lastDay){if(window._lastDay)render();window._lastDay=d}},60000); window._lastDay=today();
</script>
</body>
</html>
